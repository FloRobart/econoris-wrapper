# Overlay for a trial of the production stack on a workstation: replaces Traefik with
# ports on 127.0.0.1, and the public addresses with local ones. Never used in production.

services:
  # A profile that is never enabled keeps these services out of the trial
  traefik:
    profiles:
      - disabled
  traefik-certificates-init:
    profiles:
      - disabled

  econoris-api:
    ports:
      - 127.0.0.1:26002:80
    environment:
      BASE_URL: http://localhost:26002
      CORS_ALLOWED_ORIGINS: http://localhost:26003
      # Inside the container, "localhost" would be the container itself
      AUTH_APP_URL: http://host.docker.internal:26001
    extra_hosts:
      - host.docker.internal:host-gateway

  econoris-app:
    ports:
      - 127.0.0.1:26003:8080
    volumes:
      - type: bind
        source: ./config/app-runtime.local.env
        target: /usr/share/nginx/html/assets/.env
        read_only: true

  econoris-vitrine:
    ports:
      - 127.0.0.1:26004:8080

networks:
  # Docker can only publish a port through a network with a gateway. In production,
  # these two networks have none, because only Traefik talks to these services.
  econoris-app-net:
    internal: false
  econoris-vitrine-net:
    internal: false
